name: Release

on:
  push:
    branches: [main, beta, alpha]

# Don't cancel an in-flight release; let it finish tagging/uploading.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1) Decide + apply the version ONCE. semantic-release reads the Conventional
  #    Commits since the last tag, bumps package.json, and pushes the release
  #    commit and the vX.Y.Z tag. Then we open the GitHub Release for that tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new-release-published }}
      version: ${{ steps.semantic.outputs.new-release-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run semantic-release
        id: semantic
        run: pnpm semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.semantic.outputs.new-release-published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semantic.outputs.new-release-version }}
          name: v${{ steps.semantic.outputs.new-release-version }}
          # Any version with a pre-release identifier (e.g. 4.0.0-beta.1).
          prerelease: ${{ contains(steps.semantic.outputs.new-release-version, '-') }}
          generate_release_notes: true

  # 2) Build installers on each OS from the tag we just created, then attach
  #    them to the release. Runs only when a new version was actually published.
  build:
    needs: version
    if: needs.version.outputs.published == 'true'

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Build from the release tag so package.json carries the bumped
          # version into artifact names.
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Build the app
        env:
          VITE_TBA_API_KEY: ${{ secrets.TBA_API_KEY }}
        run: pnpm build

      - name: Package installers
        run: pnpm release

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
